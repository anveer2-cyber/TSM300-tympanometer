name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        # fonts-nanum: with a Korean font the sheet is drawn with its Korean labels, as on the clinic's PCs
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-nanum
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -rs
      - run: python -m tsm300 ports

  exe:
    # The program as a single file for PCs without Python, built and tried on Windows.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . "pyinstaller>=6.10,<7"
      - run: python tools/build_exe.py
      - shell: pwsh
        run: ./tools/check_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TSM300-exe
          path: dist/TSM300.exe
          if-no-files-found: error

  release:
    # Publishes the built program once for each version number, from the main line only.
    needs: exe
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TSM300-exe
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/tsm300/__init__.py)
          test -n "$version"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already published. Change the version number to publish a new build."
            exit 0
          fi
          gh release create "v$version" dist/TSM300.exe --target "$GITHUB_SHA" --title "TSM300 v$version" \
            --notes "TSM300.exe 를 내려받아 실행합니다. Python 설치는 필요 없습니다. 사용법은 저장소 첫 화면의 설명을 보세요."
