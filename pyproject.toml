[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsm300"
dynamic = ["version"]
description = "Receive Oscilla TSM-300 tympanometer results and save them as printable result sheets"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "matplotlib>=3.6",
    "PySide6-Essentials>=6.5",
    "pyodbc>=5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tsm300 = "tsm300.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tsm300.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
